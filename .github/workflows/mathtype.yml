name: MathType native DOCX

on:
  pull_request:
    paths:
      - 'src/officecli/**'
      - 'tests/OfficeCli.Tests/**'
      - '.github/workflows/mathtype.yml'
  push:
    branches: [main]
    paths:
      - 'src/officecli/**'
      - 'tests/OfficeCli.Tests/**'
      - '.github/workflows/mathtype.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PAPERAI_VERSION: '1.0.146-paperai.1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Read, convert, validate, preview and preserve equations
        run: dotnet test tests/OfficeCli.Tests/OfficeCli.Tests.csproj -c Release -p:Version=${{ env.PAPERAI_VERSION }} --nologo

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish trimmed Windows x64 executable
        run: dotnet publish src/officecli/officecli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=${{ env.PAPERAI_VERSION }} -o .artifacts/native --nologo
      - name: Exercise the executable without a global OfficeCLI installation
        shell: pwsh
        run: |
          if ($env:PAPERAI_VERSION -cnotmatch '^\d+\.\d+\.\d+-paperai\.\d+$') {
            throw 'Fork builds require the <upstream>-paperai.<revision> version format.'
          }
          $env:OFFICECLI_TEST_BINARY = (Resolve-Path '.artifacts/native/officecli.exe').Path
          $env:OFFICECLI_MATHTYPE_ARTIFACTS = Join-Path $PWD '.artifacts/synthetic'
          $version = (& $env:OFFICECLI_TEST_BINARY --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne $env:PAPERAI_VERSION) {
            throw "Unexpected native executable version: $version"
          }
          dotnet test tests/OfficeCli.Tests/OfficeCli.Tests.csproj -c Release -p:Version=$env:PAPERAI_VERSION --nologo
      - uses: actions/upload-artifact@v6
        with:
          name: mathtype-synthetic-native-docx
          path: .artifacts/synthetic/
          if-no-files-found: error
