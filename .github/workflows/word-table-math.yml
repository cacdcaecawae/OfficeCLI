name: Word table math preview

on:
  pull_request:
    paths:
      - 'src/officecli/Handlers/Word/**'
      - 'tests/OfficeCli.Tests/**'
      - '.github/workflows/word-table-math.yml'
  push:
    branches: [main]
    paths:
      - 'src/officecli/Handlers/Word/**'
      - 'tests/OfficeCli.Tests/**'
      - '.github/workflows/word-table-math.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/OfficeCli.Tests/OfficeCli.Tests.csproj -c Release --filter FullyQualifiedName~WordTableMathPreviewTests --nologo
